<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Códigos VIP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons para íconos limpios -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              darkbg: "#0F172A",
              darkcard: "#1E293B",
            },
          },
        },
      };
    </script>
    <style>
      /* CSS general para el tema Pastel */
      body.theme-pastel {
        background-color: #f2c9d7;
        color: #4a3b4e;
      }

      /* Estilos personalizados para las filas según la moneda seleccionada - TEMA OSCURO */
      .dark .currency-theme-DEFAULT {
        border-left-color: #64748b;
        background: linear-gradient(
          90deg,
          rgba(100, 116, 139, 0.08) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-VES {
        border-left-color: #0284c7;
        background: linear-gradient(
          90deg,
          rgba(2, 132, 199, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-CLP {
        border-left-color: #e11d48;
        background: linear-gradient(
          90deg,
          rgba(225, 29, 72, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-PEN {
        border-left-color: #ea580c;
        background: linear-gradient(
          90deg,
          rgba(234, 88, 12, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-USD {
        border-left-color: #16a34a;
        background: linear-gradient(
          90deg,
          rgba(22, 163, 74, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-MXN {
        border-left-color: #059669;
        background: linear-gradient(
          90deg,
          rgba(5, 150, 105, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-CRC {
        border-left-color: #7c3aed;
        background: linear-gradient(
          90deg,
          rgba(124, 58, 237, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-ARS {
        border-left-color: #38bdf8;
        background: linear-gradient(
          90deg,
          rgba(56, 189, 248, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-CAD {
        border-left-color: #dc2626;
        background: linear-gradient(
          90deg,
          rgba(220, 38, 38, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-HNL {
        border-left-color: #2563eb;
        background: linear-gradient(
          90deg,
          rgba(37, 99, 235, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-GTQ {
        border-left-color: #0d9488;
        background: linear-gradient(
          90deg,
          rgba(13, 148, 136, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }
      .dark .currency-theme-BOB {
        border-left-color: #d97706;
        background: linear-gradient(
          90deg,
          rgba(217, 119, 6, 0.12) 0%,
          rgba(30, 41, 59, 1) 100%
        );
      }

      /* Estilos personalizados para las filas según la moneda seleccionada - TEMA ROSA PASTEL */
      body.theme-pastel .currency-theme-VES {
        border-left-color: #7dd3fc;
        background: linear-gradient(
          90deg,
          rgba(244, 114, 182, 0.25) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-CLP {
        border-left-color: #f472b6;
        background: linear-gradient(
          90deg,
          rgba(125, 211, 252, 0.25) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-PEN {
        border-left-color: #fb923c;
        background: linear-gradient(
          90deg,
          rgba(251, 146, 60, 0.25) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-USD {
        border-left-color: #4ade80;
        background: linear-gradient(
          90deg,
          rgba(74, 222, 128, 0.25) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-MXN {
        border-left-color: #34d399;
        background: linear-gradient(
          90deg,
          rgba(252, 165, 165, 0.3) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-CRC {
        border-left-color: #c084fc;
        background: linear-gradient(
          90deg,
          rgba(192, 132, 252, 0.25) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-ARS {
        border-left-color: #a5f3fc;
        background: linear-gradient(
          90deg,
          rgba(165, 243, 252, 0.3) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-CAD {
        border-left-color: #fca5a5;
        background: linear-gradient(
          90deg,
          rgba(52, 211, 153, 0.25) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-HNL {
        border-left-color: #93c5fd;
        background: linear-gradient(
          90deg,
          rgba(147, 197, 253, 0.3) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-GTQ {
        border-left-color: #5eead4;
        background: linear-gradient(
          90deg,
          rgba(94, 234, 212, 0.3) 0%,
          #ffffff 100%
        );
      }
      body.theme-pastel .currency-theme-BOB {
        border-left-color: #fde047;
        background: linear-gradient(
          90deg,
          rgba(253, 224, 71, 0.3) 0%,
          #ffffff 100%
        );
      }

      /* Estilos del Canvas Lluvia de Estrellas */
      #stars-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        display: none;
      }

      body.theme-pastel #stars-canvas {
        display: block;
      }

      /* Ajustes visuales para elementos dinámicos en tema pastel */
      body.theme-pastel header {
        background-color: rgba(255, 255, 255, 0.85);
        border-color: #fbcfe8;
        box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.15);
      }
      body.theme-pastel .currency-row-card {
        background-color: #ffffff;
        border-color: #fbcfe8;
        box-shadow: 0 4px 12px rgba(244, 114, 182, 0.1);
      }
      body.theme-pastel .input-field {
        background-color: #fff5f8;
        border-color: #fbcfe8;
        color: #5b21b6;
      }
      body.theme-pastel .input-field:focus {
        border-color: #ec4899;
        box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2);
      }
      body.theme-pastel .output-box {
        background-color: #fff0f5;
        border-color: #fbcfe8;
      }
      body.theme-pastel .code-display {
        background-color: #ffffff;
        color: #db2777;
        border-color: #f472b6;
      }
      body.theme-pastel label {
        color: #9d4edd;
      }

      /* Ocultar flechas nativas de número en navegadores */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between antialiased transition-colors duration-500 relative"
  >
    <!-- Canvas para la animación de lluvia de estrellas (Tema Pastel) -->
    <canvas id="stars-canvas"></canvas>

    <!-- Mensaje Toast de Notificación -->
    <div
      id="toast"
      class="fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-800 text-slate-100 px-5 py-3 rounded-xl shadow-2xl border border-slate-700 transform translate-y-[-150%] opacity-0 transition-all duration-300"
    >
      <i
        id="toast-icon"
        class="ph ph-check-circle text-2xl text-emerald-400"
      ></i>
      <span id="toast-message" class="font-medium text-sm"></span>
    </div>

    <div class="max-w-6xl w-full mx-auto px-4 py-8 z-10 relative">
      <!-- Encabezado -->
      <header
        class="mb-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-800/80 backdrop-blur border border-slate-700/60 p-6 rounded-2xl shadow-xl transition-all"
      >
        <div>
          <h1
            id="header-title"
            class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 flex items-center justify-center sm:justify-start gap-3"
          >
            <i class="ph ph-ticket text-indigo-400 text-3xl"></i> Generador de
            Códigos VIP
          </h1>
          <p id="header-subtitle" class="text-slate-400 text-sm mt-1"></p>
        </div>
        <div class="flex flex-wrap items-center gap-3 justify-center">
          <!-- Botón de Alternar Tema -->
          <button
            id="btn-theme-toggle"
            class="flex items-center gap-2 bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white px-4 py-2.5 rounded-xl font-semibold shadow-md transition-all active:scale-95 text-sm"
            title="Cambiar Tema"
          >
            <i id="theme-icon" class="ph ph-sparkle text-lg"></i>
            <span id="theme-label">Tema Mariangel</span>
          </button>
          <button
            id="btn-add-row"
            class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition-all active:scale-95 text-sm"
          >
            <i class="ph ph-plus-circle text-lg"></i> Nueva Fila
          </button>
        </div>
      </header>

      <!-- Contenedor Principal de Filas -->
      <main id="rows-container" class="space-y-4">
        <!-- Las filas se generarán dinámicamente desde JS -->
      </main>
    </div>

    <!-- Pie de página -->
    <footer
      id="footer-text"
      class="py-6 text-center text-xs text-slate-500 border-t border-slate-800 z-10 relative"
    >
      <p>Generador de Códigos VIP &copy; Dear Luna ❤, TQM</p>
    </footer>

    <script>
      // Monedas disponibles
      const CURRENCIES = [
        "VES",
        "CLP",
        "PEN",
        "USD",
        "MXN",
        "CRC",
        "ARS",
        "CAD",
        "HNL",
        "GTQ",
        "BOB",
      ];

      // Contenedor de filas y botones
      const rowsContainer = document.getElementById("rows-container");
      const btnAddRow = document.getElementById("btn-add-row");
      const btnThemeToggle = document.getElementById("btn-theme-toggle");
      const themeIcon = document.getElementById("theme-icon");
      const themeLabel = document.getElementById("theme-label");

      let rowCounter = 0;
      let isPastelTheme = false;

      // Inicializar la aplicación con 3 filas iniciales
      window.onload = function () {
        createRow("USD", "08:00", "16:00");
        createRow("VES", "23:30", "01:12"); // Ejemplo horario nocturno
        createRow("MXN", "18:00", "23:59");
        initStarfallAnimation();
      };

      // Event Listeners principales
      btnAddRow.addEventListener("click", () => {
        createRow();
        showToast("Nueva fila agregada", "info");
      });

      btnThemeToggle.addEventListener("click", toggleTheme);

      /**
       * Alterna entre el tema oscuro y el tema rosa pastel
       */
      function toggleTheme() {
        isPastelTheme = !isPastelTheme;
        const html = document.documentElement;
        const body = document.body;
        const headerTitle = document.getElementById("header-title");
        const headerSubtitle = document.getElementById("header-subtitle");
        const footerText = document.getElementById("footer-text");

        if (isPastelTheme) {
          html.classList.remove("dark");
          body.classList.add("theme-pastel");
          body.classList.remove("bg-slate-900", "text-slate-100");

          themeIcon.className = "ph ph-moon text-lg";
          themeLabel.textContent = "Tema Oscuro";
          btnThemeToggle.className =
            "flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-4 py-2.5 rounded-xl font-semibold shadow-md transition-all active:scale-95 text-sm";

          headerTitle.className =
            "text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-400 flex items-center justify-center sm:justify-start gap-3";
          headerSubtitle.className = "text-purple-600/80 text-sm mt-1";
          footerText.className =
            "py-6 text-center text-xs text-purple-600 border-t border-pink-200 z-10 relative";

          btnAddRow.className =
            "flex items-center gap-2 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2.5 rounded-xl font-semibold shadow-lg shadow-purple-500/20 transition-all active:scale-95 text-sm";

          showToast("Tema Rosa Pastel activado ✨", "info");
        } else {
          html.classList.add("dark");
          body.classList.remove("theme-pastel");
          body.classList.add("bg-slate-900", "text-slate-100");

          themeIcon.className = "ph ph-sparkle text-lg";
          themeLabel.textContent = "Tema Rosa";
          btnThemeToggle.className =
            "flex items-center gap-2 bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white px-4 py-2.5 rounded-xl font-semibold shadow-md transition-all active:scale-95 text-sm";

          headerTitle.className =
            "text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 flex items-center justify-center sm:justify-start gap-3";
          headerSubtitle.className = "text-slate-400 text-sm mt-1";
          footerText.className =
            "py-6 text-center text-xs text-slate-500 border-t border-slate-800 z-10 relative";

          btnAddRow.className =
            "flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-semibold shadow-lg shadow-indigo-600/30 transition-all active:scale-95 text-sm";

          showToast("Tema Oscuro activado 🌙", "info");
        }
      }

      /**
       * Crea una nueva fila interactiva en la interfaz
       */
      function createRow(
        defaultCurrency = "USD",
        defaultStart = "",
        defaultEnd = "",
      ) {
        rowCounter++;
        const rowId = `row-${rowCounter}`;

        const rowElement = document.createElement("div");
        rowElement.id = rowId;
        rowElement.className = `currency-row-card currency-theme-${defaultCurrency} border-l-4 bg-slate-800 rounded-xl p-4 sm:p-5 border border-slate-700/60 shadow-md transition-all duration-300`;

        rowElement.innerHTML = `
                <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
                    
                    <!-- Sección de Controles (Moneda y Horarios) -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 flex-grow">
                        
                        <!-- Select de Moneda -->
                        <div>
                            <label class="block text-xs font-semibold mb-1">Moneda</label>
                            <div class="relative">
                                <select class="currency-select input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                                    ${CURRENCIES.map((curr) => `<option value="${curr}" ${curr === defaultCurrency ? "selected" : ""}>${curr}</option>`).join("")}
                                </select>
                            </div>
                        </div>

                        <!-- Hora Inicio -->
                        <div>
                            <label class="block text-xs font-semibold mb-1">Hora Inicio (HH:MM)</label>
                            <div class="relative">
                                <input type="text" 
                                       placeholder="23:30" 
                                       maxLength="5" 
                                       value="${defaultStart}"
                                       class="start-time input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                                />
                            </div>
                        </div>

                        <!-- Hora Fin -->
                        <div>
                            <label class="block text-xs font-semibold mb-1">Hora Fin (HH:MM)</label>
                            <div class="relative">
                                <input type="text" 
                                       placeholder="01:12" 
                                       maxLength="5" 
                                       value="${defaultEnd}"
                                       class="end-time input-field w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                                />
                            </div>
                        </div>
                    </div>

                    <!-- Botón Validar & Acciones -->
                    <div class="flex items-end gap-2 shrink-0">
                        <button type="button" class="btn-validate flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition-colors active:scale-95 shadow-md">
                            <i class="ph ph-check-bold"></i> Validar
                        </button>
                        <button type="button" class="btn-delete text-slate-400 hover:text-rose-400 p-2 rounded-lg hover:bg-slate-700/50 transition-colors" title="Eliminar Fila">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Campo de Salida Oculto (Se revela tras validar) -->
                <div class="output-container output-box hidden mt-4 pt-4 border-t border-slate-700/50 flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-900/60 p-3 rounded-lg">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <span class="text-xs uppercase font-bold opacity-75">Código Generado:</span>
                        <span class="generated-code code-display font-mono text-base font-extrabold text-emerald-400 bg-slate-950 px-3 py-1 rounded border border-emerald-500/30 select-all"></span>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button type="button" class="btn-copy flex items-center gap-1 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-3 py-1.5 rounded-md font-medium transition-colors">
                            <i class="ph ph-copy"></i> Copiar
                        </button>
                    </div>
                </div>
            `;

        rowsContainer.appendChild(rowElement);

        // Asignación de referencias a elementos de la fila
        const currencySelect = rowElement.querySelector(".currency-select");
        const startTimeInput = rowElement.querySelector(".start-time");
        const endTimeInput = rowElement.querySelector(".end-time");
        const btnValidate = rowElement.querySelector(".btn-validate");
        const btnDelete = rowElement.querySelector(".btn-delete");
        const outputContainer = rowElement.querySelector(".output-container");
        const generatedCodeSpan = rowElement.querySelector(".generated-code");
        const btnCopy = rowElement.querySelector(".btn-copy");

        // 1. Cambio de Color por Moneda
        currencySelect.addEventListener("change", (e) => {
          const currency = e.target.value;
          // Reemplazar clases de tema
          rowElement.className = rowElement.className.replace(
            /currency-theme-\w+/g,
            "",
          );
          rowElement.classList.add(`currency-theme-${currency}`);
        });

        // 2. Formateo y Restricción estricta de Hora (Solo números y auto-dos-puntos)
        [startTimeInput, endTimeInput].forEach((input) => {
          input.addEventListener("keydown", (e) => {
            // Permitir teclas de navegación/edición
            if (
              [
                "Backspace",
                "Delete",
                "Tab",
                "ArrowLeft",
                "ArrowRight",
                "Home",
                "End",
              ].includes(e.key)
            ) {
              return;
            }
            // Bloquear si no es dígito
            if (!/^[0-9]$/.test(e.key)) {
              e.preventDefault();
            }
          });

          input.addEventListener("input", (e) => {
            let val = e.target.value.replace(/[^0-9]/g, ""); // Filtrar cualquier letra

            if (val.length >= 3) {
              val = val.substring(0, 2) + ":" + val.substring(2, 4);
            }
            e.target.value = val.substring(0, 5);
          });

          // Auto-validar al presionar Enter en los inputs
          input.addEventListener("keyup", (e) => {
            if (e.key === "Enter") {
              btnValidate.click();
            }
          });
        });

        // 3. Lógica de Validación y Generación de Código
        btnValidate.addEventListener("click", () => {
          const currency = currencySelect.value;
          const startTime = startTimeInput.value.trim();
          const endTime = endTimeInput.value.trim();

          // Validaciones básicas de formato
          if (!isValidTimeFormat(startTime)) {
            showToast(
              "Formato de Hora Inicio inválido (HH:MM entre 00:00 y 23:59)",
              "error",
            );
            startTimeInput.focus();
            return;
          }

          if (!isValidTimeFormat(endTime)) {
            showToast(
              "Formato de Hora Fin inválido (HH:MM entre 00:00 y 23:59)",
              "error",
            );
            endTimeInput.focus();
            return;
          }

          // Validación de horas: La hora de inicio no puede ser mayor que la hora fin,
          // excepto en franjas nocturnas que inician en la noche y terminan al día siguiente.
          const rangeValidation = validateTimeRange(startTime, endTime);
          if (!rangeValidation.valid) {
            showToast(rangeValidation.message, "error");
            return;
          }

          // Generación de código exacto: VIP${moneda}-${hrInicio}-${hrFin}
          const vipCode = `VIP${currency}-${startTime}-${endTime}`;
          generatedCodeSpan.textContent = vipCode;

          // Revelar el campo de salida y copiar automáticamente al portapapeles
          outputContainer.classList.remove("hidden");
          copyToClipboard(vipCode, true);
        });

        // 4. Botón Copiar Código Individual
        btnCopy.addEventListener("click", () => {
          const code = generatedCodeSpan.textContent;
          if (code) {
            copyToClipboard(code);
          }
        });

        // 5. Botón Eliminar Fila
        btnDelete.addEventListener("click", () => {
          if (rowsContainer.children.length <= 1) {
            showToast("Debes mantener al menos una fila en pantalla", "error");
            return;
          }
          rowElement.remove();
          showToast("Fila eliminada", "info");
        });
      }

      /**
       * Animación en Canvas de Lluvia de Estrellas en Tonos Pastel
       */
      function initStarfallAnimation() {
        const canvas = document.getElementById("stars-canvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        const stars = [];
        const numStars = 45;
        const colors = ["#f472b6", "#c084fc", "#60a5fa", "#f3e8ff", "#fbcfe8"];

        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            length: Math.random() * 80 + 40,
            speed: Math.random() * 3 + 1.5,
            color: colors[Math.floor(Math.random() * colors.length)],
            opacity: Math.random() * 0.7 + 0.3,
            width: Math.random() * 1.8 + 0.8,
          });
        }

        function animateStars() {
          if (isPastelTheme) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach((star) => {
              ctx.beginPath();
              const gradient = ctx.createLinearGradient(
                star.x,
                star.y,
                star.x - star.length * 0.5,
                star.y + star.length,
              );
              gradient.addColorStop(0, star.color);
              gradient.addColorStop(1, "transparent");

              ctx.strokeStyle = gradient;
              ctx.lineWidth = star.width;
              ctx.lineCap = "round";

              ctx.moveTo(star.x, star.y);
              ctx.lineTo(star.x - star.length * 0.4, star.y + star.length);
              ctx.stroke();

              // Actualizar posición
              star.y += star.speed;
              star.x -= star.speed * 0.4;

              // Reiniciar estrellas que salen de pantalla
              if (star.y > canvas.height || star.x < 0) {
                star.y = -20;
                star.x = Math.random() * (canvas.width + 200);
              }
            });
          }
          requestAnimationFrame(animateStars);
        }

        animateStars();
      }

      /**
       * Valida sintácticamente la hora en rango HH:MM
       */
      function isValidTimeFormat(timeStr) {
        const regex = /^([0-1][0-9]|2[0-3]):[0-5][0-9]$/;
        return regex.test(timeStr);
      }

      /**
       * Valida la coherencia de la franja horaria.
       */
      function validateTimeRange(startTime, endTime) {
        if (startTime === endTime) {
          return { valid: true };
        }

        const [startH, startM] = startTime.split(":").map(Number);
        const [endH, endM] = endTime.split(":").map(Number);

        const startMinutes = startH * 60 + startM;
        const endMinutes = endH * 60 + endM;

        if (startMinutes < endMinutes) {
          return { valid: true };
        }

        if (startH >= 18 && endH <= 12) {
          return { valid: true };
        }

        return {
          valid: false,
          message: `Rango horaria no válido (${startTime} a ${endTime}). La hora de inicio no puede ser mayor a la hora de fin.`,
        };
      }

      /**
       * Copia texto usando execCommand como fallback seguro y notifica al usuario
       */
      function copyToClipboard(text, isFromValidation = false) {
        if (!text) return;

        const tempInput = document.createElement("textarea");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        if (isFromValidation) {
          showToast(
            `Código ${text} generado y copiado al portapapeles`,
            "success",
          );
        } else {
          showToast(`Copiado: ${text}`, "success");
        }
      }

      /**
       * Notificaciones tipo Toast
       */
      function showToast(message, type = "info") {
        const toast = document.getElementById("toast");
        const toastMessage = document.getElementById("toast-message");
        const toastIcon = document.getElementById("toast-icon");

        toastMessage.textContent = message;

        if (type === "success") {
          toastIcon.className = "ph ph-check-circle text-2xl text-emerald-400";
        } else if (type === "error") {
          toastIcon.className = "ph ph-warning-circle text-2xl text-rose-400";
        } else {
          toastIcon.className = "ph ph-info text-2xl text-sky-400";
        }

        toast.classList.remove("translate-y-[-150%]", "opacity-0");
        toast.classList.add("translate-y-0", "opacity-100");

        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add("translate-y-[-150%]", "opacity-0");
        }, 3000);
      }
    </script>
  </body>
</html>
